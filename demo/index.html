<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRG Viewer 浏览器预览</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        background: #f5f5f4;
        color: #1f2328;
      }
      header { padding: 18px 24px 10px; }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
      p { margin: 0 0 12px; color: #57606a; }
      #drop {
        border: 1px dashed #b8b8b8;
        border-radius: 10px;
        padding: 12px 14px;
        background: #fff;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      #drop.is-over { border-color: #4c8bf5; background: #eef4ff; }
      #status { color: #57606a; }
      #status.error { color: #b42318; }
      main { padding: 14px 24px 32px; }
      #viewer { max-width: 1400px; }
      @media (prefers-color-scheme: dark) {
        body { background: #161616; color: #e6e6e6; }
        p, #status { color: #a0a0a0; }
        #drop { background: #1f1f1f; border-color: #444; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PRG Viewer 浏览器预览</h1>
      <p>只读打开 Project Graph 2.7.0 文件。文件不会上传。</p>
      <div id="drop">
        <input id="file" type="file" accept=".prg,application/zip" />
        <span>或把 .prg 拖到这里</span>
        <span id="status">等待文件</span>
      </div>
    </header>
    <main><div id="viewer"></div></main>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
